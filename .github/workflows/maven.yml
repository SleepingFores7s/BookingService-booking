name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: Booking-service
          MYSQL_ROOT_PASSWORD: ${{ secrets.BOOKING_DB_ROOT_PASS }}
          MYSQL_USER: ${{ secrets.BOOKING_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.BOOKING_DB_PASS }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET_KEY }}
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/Booking-service
        SPRING_DATASOURCE_USERNAME: ${{ secrets.BOOKING_DB_USER }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.BOOKING_DB_PASS }}

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
