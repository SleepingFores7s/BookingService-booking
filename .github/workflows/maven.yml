name: Booking-Service CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Docker Compose Stack
        run: docker compose up -d
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOKING_DB_COMPOSE_URL: ${{ secrets.BOOKING_DB_COMPOSE_URL }} #TODO make github secret for url's
          BOOKING_DB_ROOT_PASS: ${{ secrets.BOOKING_DB_ROOT_PASS }}
          BOOKING_DB_USER: ${{ secrets.BOOKING_DB_USER }}
          BOOKING_DB_PASS: ${{ secrets.BOOKING_DB_PASS }}

          CUSTOMER_DB_COMPOSE_URL: ${{ secrets.CUSTOMER_DB_COMPOSE_URL }} #TODO make github secret for url's
          CUSTOMER_DB_ROOT_PASS: ${{ secrets.CUSTOMER_DB_ROOT_PASS }}
          CUSTOMER_DB_PASS: ${{ secrets.CUSTOMER_DB_PASS }}
          CUSTOMER_DB_USER: ${{ secrets.CUSTOMER_DB_USER }}

          REVIEW_DB_COMPOSE_URL: ${{ secrets.REVIEW_DB_COMPOSE_URL }} #TODO make github secret for url's
          REVIEW_DB_ROOT_PASS: ${{ secrets.REVIEW_DB_ROOT_PASS }}
          REVIEW_DB_PASS: ${{ secrets.REVIEW_DB_PASS }}
          REVIEW_DB_USER: ${{ secrets.REVIEW_DB_USER }}

      - name: Wait for MySQL Databases to be Ready
        run: |
          echo "Waiting for databases to accept connections..."
          until nc -z localhost 3307 && nc -z localhost 3308 && nc -z localhost 3309; do
            sleep 2
          done
          echo "Databases are up and running!"

      - name: Run Integration Tests with Maven
        run: mvn -B clean test --file pom.xml
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOKING_DB_TEST_URL: ${{ secrets.BOOKING_DB_TEST_URL }} #jdbc:mysql://localhost:3307/Booking-service #TODO MAKE GITHUB SECRET
          SPRING_DATASOURCE_USERNAME: ${{ secrets.BOOKING_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.BOOKING_DB_PASS }}

      - name: Stop Containers and Cleanup
        if: always()
        run: docker compose down

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6


  deploy_to_docker_hub:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Image and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: 'true'
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/booking-booking:latest

      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME}}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/booking-booking:latest
            cd /opt/docker/school_projects/monster_retirement_home
            docker compose pull
            docker compose up -d --no-deps booking-service