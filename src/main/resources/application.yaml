spring:
  application:
    name: Booking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:${BOOKING_DB_LOCAL_URL}}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASS}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always


jwt:
  secret: ${JWT_SECRET}

server:
  port: 8082